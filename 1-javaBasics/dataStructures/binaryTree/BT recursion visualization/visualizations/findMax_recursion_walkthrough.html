<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>findMax — recursive call stack walkthrough</title>
<style>
  :root {
    --surface-2: #ffffff;
    --surface-1: #f7f6f2;
    --surface-0: #f1efe8;
    --text-primary: #1a1a1a;
    --text-secondary: #5f5e5a;
    --text-muted: #888780;
    --border: rgba(0,0,0,0.10);
    --border-strong: rgba(0,0,0,0.20);
    --border-accent: #185fa5;
    --bg-accent: #e6f1fb;
    --text-accent: #0c447c;
    --radius: 8px;
    --font-sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    --font-mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --surface-2: #232320;
      --surface-1: #2c2c2a;
      --surface-0: #1c1c1a;
      --text-primary: #f1efe8;
      --text-secondary: #b4b2a9;
      --text-muted: #888780;
      --border: rgba(255,255,255,0.12);
      --border-strong: rgba(255,255,255,0.22);
      --border-accent: #85b7eb;
      --bg-accent: #0c447c;
      --text-accent: #b5d4f4;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    padding: 32px 20px;
    background: var(--surface-0);
    color: var(--text-primary);
    font-family: var(--font-sans);
  }
  .wrap {
    max-width: 720px;
    margin: 0 auto;
    background: var(--surface-2);
    border: 0.5px solid var(--border);
    border-radius: 12px;
    padding: 24px;
  }
  h1 { font-size: 18px; font-weight: 500; margin: 0 0 20px; }
  .th { font-size: 14px; font-weight: 500; fill: var(--text-primary); }
  .ts { font-size: 12px; fill: var(--text-secondary); }
  .tnode circle { fill: var(--surface-1); stroke: var(--border-strong); }
  .tnode.c-blue circle { fill: #e6f1fb; stroke: #378add; }
  .tnode.c-blue text.th { fill: #0c447c; }
  .tnode.c-teal circle { fill: #e1f5ee; stroke: #1d9e75; }
  .tnode.c-teal text.th { fill: #085041; }
  @media (prefers-color-scheme: dark) {
    .tnode.c-blue circle { fill: #0c447c; stroke: #85b7eb; }
    .tnode.c-blue text.th { fill: #e6f1fb; }
    .tnode.c-teal circle { fill: #085041; stroke: #5dcaa5; }
    .tnode.c-teal text.th { fill: #e1f5ee; }
  }
  button {
    font-family: var(--font-sans);
    font-size: 13px;
    padding: 6px 14px;
    border-radius: var(--radius);
    border: 0.5px solid var(--border-strong);
    background: transparent;
    color: var(--text-primary);
    cursor: pointer;
  }
  button:hover:not(:disabled) { background: var(--surface-1); }
  button:disabled { opacity: 0.4; cursor: default; }
  .sr-only {
    position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px;
    overflow: hidden; clip: rect(0,0,0,0); white-space: nowrap; border: 0;
  }
</style>
</head>
<body>
<div class="wrap">
<h1>findMax — recursive call stack walkthrough</h1>
<h2 class="sr-only">Step-through visualization of the findMax recursive call stack on a sample binary tree, showing nodes pushed and popped as the maximum value 90 is found</h2>

<svg width="100%" viewBox="0 0 680 350">
<line x1="340" y1="50" x2="200" y2="130" stroke="var(--border-strong)" stroke-width="0.5"/>
<line x1="340" y1="50" x2="480" y2="130" stroke="var(--border-strong)" stroke-width="0.5"/>
<line x1="200" y1="130" x2="110" y2="210" stroke="var(--border-strong)" stroke-width="0.5"/>
<line x1="200" y1="130" x2="290" y2="210" stroke="var(--border-strong)" stroke-width="0.5"/>
<line x1="480" y1="130" x2="410" y2="210" stroke="var(--border-strong)" stroke-width="0.5"/>
<line x1="480" y1="130" x2="560" y2="210" stroke="var(--border-strong)" stroke-width="0.5"/>
<line x1="560" y1="210" x2="510" y2="290" stroke="var(--border-strong)" stroke-width="0.5"/>
<line x1="560" y1="210" x2="610" y2="290" stroke="var(--border-strong)" stroke-width="0.5"/>

<g id="g-n10" class="tnode c-gray"><circle cx="340" cy="50" r="22" stroke-width="0.5"/><text class="th" x="340" y="50" text-anchor="middle" dominant-baseline="central">10</text></g>
<g id="g-n30a" class="tnode c-gray"><circle cx="200" cy="130" r="22" stroke-width="0.5"/><text class="th" x="200" y="130" text-anchor="middle" dominant-baseline="central">30</text></g>
<g id="g-n20" class="tnode c-gray"><circle cx="480" cy="130" r="22" stroke-width="0.5"/><text class="th" x="480" y="130" text-anchor="middle" dominant-baseline="central">20</text></g>
<g id="g-n50" class="tnode c-gray"><circle cx="110" cy="210" r="22" stroke-width="0.5"/><text class="th" x="110" y="210" text-anchor="middle" dominant-baseline="central">50</text></g>
<g id="g-n90" class="tnode c-gray"><circle cx="290" cy="210" r="22" stroke-width="0.5"/><text class="th" x="290" y="210" text-anchor="middle" dominant-baseline="central">90</text></g>
<g id="g-n70" class="tnode c-gray"><circle cx="410" cy="210" r="22" stroke-width="0.5"/><text class="th" x="410" y="210" text-anchor="middle" dominant-baseline="central">70</text></g>
<g id="g-n80" class="tnode c-gray"><circle cx="560" cy="210" r="22" stroke-width="0.5"/><text class="th" x="560" y="210" text-anchor="middle" dominant-baseline="central">80</text></g>
<g id="g-n30b" class="tnode c-gray"><circle cx="510" cy="290" r="22" stroke-width="0.5"/><text class="th" x="510" y="290" text-anchor="middle" dominant-baseline="central">30</text></g>
<g id="g-n40" class="tnode c-gray"><circle cx="610" cy="290" r="22" stroke-width="0.5"/><text class="th" x="610" y="290" text-anchor="middle" dominant-baseline="central">40</text></g>

<text id="lbl-n10" class="ts" x="340" y="84" text-anchor="middle"></text>
<text id="lbl-n30a" class="ts" x="200" y="164" text-anchor="middle"></text>
<text id="lbl-n20" class="ts" x="480" y="164" text-anchor="middle"></text>
<text id="lbl-n50" class="ts" x="110" y="244" text-anchor="middle"></text>
<text id="lbl-n90" class="ts" x="290" y="244" text-anchor="middle"></text>
<text id="lbl-n70" class="ts" x="410" y="244" text-anchor="middle"></text>
<text id="lbl-n80" class="ts" x="560" y="244" text-anchor="middle"></text>
<text id="lbl-n30b" class="ts" x="510" y="324" text-anchor="middle"></text>
<text id="lbl-n40" class="ts" x="610" y="324" text-anchor="middle"></text>
</svg>

<div style="display:flex;gap:16px;justify-content:center;margin:4px 0 20px;font-size:12px;color:var(--text-secondary)">
<span><span style="display:inline-block;width:10px;height:10px;border-radius:50%;background:var(--border-strong);margin-right:4px"></span>not called yet</span>
<span><span style="display:inline-block;width:10px;height:10px;border-radius:50%;background:#378ADD;margin-right:4px"></span>on the call stack</span>
<span><span style="display:inline-block;width:10px;height:10px;border-radius:50%;background:#1D9E75;margin-right:4px"></span>returned</span>
</div>

<div style="display:flex;gap:20px;flex-wrap:wrap">
<div style="flex:1;min-width:220px">
<p style="font-size:13px;color:var(--text-muted);margin:0 0 8px">Call stack (top = most recent)</p>
<div id="stack-panel"></div>
</div>
<div style="flex:1.4;min-width:260px">
<p style="font-size:13px;color:var(--text-muted);margin:0 0 8px">What's happening</p>
<div id="desc" style="font-size:14px;line-height:1.6;min-height:64px"></div>
</div>
</div>

<div style="display:flex;align-items:center;gap:12px;margin-top:16px">
<button id="btn-prev">Previous</button>
<button id="btn-next">Next</button>
<span id="step-counter" style="font-size:13px;color:var(--text-secondary);margin-left:auto"></span>
</div>
</div>

<script>
const NODES = {
  n10:{val:10}, n30a:{val:30}, n20:{val:20},
  n50:{val:50}, n90:{val:90}, n70:{val:70}, n80:{val:80},
  n30b:{val:30}, n40:{val:40}
};
const STEPS = [
 {stack:['n10'], ret:null, desc:'Call findMax(10) on the root.'},
 {stack:['n10','n30a'], ret:null, desc:'10 recurses left: findMax(30).'},
 {stack:['n10','n30a','n50'], ret:null, desc:'30 recurses left: findMax(50).'},
 {stack:['n10','n30a'], ret:['n50',50], desc:'50 has no children, base case, returns 50.'},
 {stack:['n10','n30a','n90'], ret:null, desc:'30 recurses right: findMax(90).'},
 {stack:['n10','n30a'], ret:['n90',90], desc:'90 has no children, base case, returns 90.'},
 {stack:['n10'], ret:['n30a',90], desc:'30 combines: max(30, 50, 90) is 90. Pops off the stack.'},
 {stack:['n10','n20'], ret:null, desc:'10 recurses right: findMax(20).'},
 {stack:['n10','n20','n70'], ret:null, desc:'20 recurses left: findMax(70).'},
 {stack:['n10','n20'], ret:['n70',70], desc:'70 has no children, base case, returns 70.'},
 {stack:['n10','n20','n80'], ret:null, desc:'20 recurses right: findMax(80).'},
 {stack:['n10','n20','n80','n30b'], ret:null, desc:'80 recurses left: findMax(30).'},
 {stack:['n10','n20','n80'], ret:['n30b',30], desc:'This 30 has no children, base case, returns 30.'},
 {stack:['n10','n20','n80','n40'], ret:null, desc:'80 recurses right: findMax(40).'},
 {stack:['n10','n20','n80'], ret:['n40',40], desc:'40 has no children, base case, returns 40.'},
 {stack:['n10','n20'], ret:['n80',80], desc:'80 combines: max(80, 30, 40) is 80. Pops off the stack.'},
 {stack:['n10'], ret:['n20',80], desc:'20 combines: max(20, 70, 80) is 80. Pops off the stack.'},
 {stack:[], ret:['n10',90], desc:'10 combines: max(10, 90, 80) is 90. Stack empty, done.'}
];
let idx = 0;
function computeReturned(uptoIdx){
  const map = {};
  for(let i=0;i<=uptoIdx;i++){
    if(STEPS[i].ret){ map[STEPS[i].ret[0]] = STEPS[i].ret[1]; }
  }
  return map;
}
function render(){
  const step = STEPS[idx];
  const returned = computeReturned(idx);
  const stackSet = new Set(step.stack);
  Object.keys(NODES).forEach(id=>{
    const g = document.getElementById('g-'+id);
    const lbl = document.getElementById('lbl-'+id);
    if(id in returned){
      g.setAttribute('class','tnode c-teal');
      lbl.textContent = '= '+returned[id];
    } else if(stackSet.has(id)){
      g.setAttribute('class','tnode c-blue');
      lbl.textContent = '';
    } else {
      g.setAttribute('class','tnode c-gray');
      lbl.textContent = '';
    }
  });
  const panel = document.getElementById('stack-panel');
  panel.innerHTML = '';
  if(step.stack.length===0){
    panel.innerHTML = '<div style="font-size:13px;color:var(--text-muted);padding:8px 0">Stack is empty</div>';
  } else {
    for(let i=step.stack.length-1;i>=0;i--){
      const id = step.stack[i];
      const isTop = i===step.stack.length-1;
      const div = document.createElement('div');
      div.textContent = 'findMax('+NODES[id].val+')';
      div.style.cssText = 'padding:8px 12px;margin-bottom:4px;border-radius:var(--radius);font-size:13px;font-family:var(--font-mono);'+
        (isTop ? 'background:var(--bg-accent);color:var(--text-accent);border:0.5px solid var(--border-accent)' : 'background:var(--surface-1);color:var(--text-secondary);border:0.5px solid var(--border)');
      panel.appendChild(div);
    }
  }
  document.getElementById('desc').textContent = step.desc;
  document.getElementById('step-counter').textContent = 'Step '+(idx+1)+' of '+STEPS.length;
  document.getElementById('btn-prev').disabled = idx===0;
  document.getElementById('btn-next').disabled = idx===STEPS.length-1;
}
document.getElementById('btn-prev').onclick = ()=>{ if(idx>0){idx--;render();} };
document.getElementById('btn-next').onclick = ()=>{ if(idx<STEPS.length-1){idx++;render();} };
render();
</script>
</body>
</html>
